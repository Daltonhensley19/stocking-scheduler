# Builds the downloads for Windows, macOS and Linux:
#   Windows: setup wizard (.exe) + portable zip
#   macOS:   installer (.pkg) + zipped .app — Apple Silicon and Intel
#   Linux:   tar.gz
#
# Push this repo to GitHub, then either push a tag like v1.0 (creates a Release
# with the downloads attached; the tag becomes the version number) or run the
# workflow by hand from the Actions tab (downloads appear under "Artifacts" on
# the run page).

name: Build executables

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: StockingScheduler-windows
          - os: macos-latest        # Apple Silicon (M1 and newer)
            artifact: StockingScheduler-macos-arm64
          - os: macos-15-intel      # Intel Macs
            artifact: StockingScheduler-macos-intel
          - os: ubuntu-latest
            artifact: StockingScheduler-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Linux libraries Qt needs for the headless smoke test
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0

      - name: Inno Setup (Windows installer compiler)
        if: runner.os == 'Windows'
        run: choco install innosetup --no-progress -y

      - name: Install dependencies
        run: uv sync --group build

      - name: Build portable download
        run: uv run --group build python build.py

      - name: Build installer
        if: runner.os != 'Linux'
        run: uv run --group build python build.py --installer

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: downloads/*
          body: |
            ## Which file do I need?

            | Your computer | Download this |
            |---|---|
            | Windows 10 or 11 | **StockingScheduler-Setup-windows.exe** |
            | Mac with an Apple chip (M1, M2, M3, M4…) | **StockingScheduler-Setup-macos-arm64.pkg** |
            | Mac with an Intel chip | **StockingScheduler-Setup-macos-intel.pkg** |

            Not sure which Mac you have? Apple logo (top-left) → **About This Mac** → look at **Chip**.

            Your computer will warn you the first time because the app isn't code-signed — that's expected.
            **[Step-by-step install help, including those warnings](${{ github.server_url }}/${{ github.repository }}#download--install)**

            Updating? Just install the new version over the old one — your schedules are kept.

            <sub>The `.zip` / `.tar.gz` files are portable copies for advanced users; most people don't need them.</sub>
