[project]
name = "stocking-scheduler"
version = "0.1.0"
description = "Daily pick & run scheduler for a retail stocking team"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8",
    "openpyxl>=3.1",
]

[project.scripts]
stocking-scheduler = "scheduler.app:main"

[dependency-groups]
build = ["pyinstaller>=6.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scheduler"]
